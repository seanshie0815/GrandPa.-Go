<!DOCTYPE html>
<html lang="zh-TW">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grandpa GO - 長者健康互動應用</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body { margin: 0; padding: 0; font-family: 'Noto Sans TC', sans-serif; box-sizing: border-box; }
    html, body, #app { height: 100%; width: 100%; overflow-x: hidden; }
    
    /* 動畫效果 */
    .bounce-in { animation: bounceIn 0.5s ease-out; }
    @keyframes bounceIn {
      0% { transform: scale(0.9); opacity: 0; }
      50% { transform: scale(1.02); }
      100% { transform: scale(1); opacity: 1; }
    }
    .slide-up { animation: slideUp 0.4s ease-out; }
    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .pulse-animation { animation: pulse 2s infinite; }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    .btn-scale:active { transform: scale(0.95) !important; }
    
    /* 卡片與樣式 */
    .game-card { transition: all 0.3s ease; }
    .game-card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
    
    .match-card { width: 100%; aspect-ratio: 1; perspective: 1000px; cursor: pointer; }
    .match-card .card-inner { width: 100%; height: 100%; transition: transform 0.6s; transform-style: preserve-3d; position: relative; }
    .match-card.flipped .card-inner { transform: rotateY(180deg); }
    .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; border-radius: 12px; font-size: 32px; }
    .card-back { transform: rotateY(180deg); }
    
    .growth-bar { position: relative; overflow: hidden; border-radius: 9999px; }
    .growth-fill { transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
  </style>
  
  <script type="module">
    // ========== 1. Firebase 初始化 (已恢復雲端功能) ==========
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, get, child, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD0R-PyENXhg4yG1kdBxqnf4ClxO_rkGNI",
      authDomain: "grandpa-go.firebaseapp.com",
      databaseURL: "https://grandpa-go-default-rtdb.firebaseio.com",
      projectId: "grandpa-go",
      storageBucket: "grandpa-go.firebasestorage.app",
      messagingSenderId: "333930750579",
      appId: "1:333930750579:web:d1e9a8c44d69ac976e4006",
      measurementId: "G-GSJK0D1E0F"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // ========== 2. 全域變數 ==========
    const CURRENT_USER_KEY = 'grandpa_go_current_user';
    const FONT_SIZE_KEY = 'grandpa_go_font_size';
    
    // 讀取本地緩存的登入者資訊 (只為了保持登入狀態，資料還是從雲端拉)
    let localUserCache = null;
    try { localUserCache = JSON.parse(localStorage.getItem(CURRENT_USER_KEY)); } catch(e) {}

    let currentUser = localUserCache; 
    let currentPage = currentUser ? (currentUser.isAdmin ? 'admin' : 'home') : 'login';
    let fontSize = parseInt(localStorage.getItem(FONT_SIZE_KEY)) || 18;
    
    const ADMIN_USERNAME = 'admin';
    const ADMIN_PASSWORD = 'admin';

    // ========== 3. 資料庫操作 ==========

    function saveCurrentUserLocally(user) {
      currentUser = user;
      localStorage.setItem(CURRENT_USER_KEY, JSON.stringify(user));
    }

    // 讀取單一用戶
    async function getUserFromCloud(username) {
      try {
        const snapshot = await get(child(ref(db), `users/${username}`));
        return snapshot.exists() ? snapshot.val() : null;
      } catch (error) {
        console.error("讀取失敗:", error);
        return null;
      }
    }

    // 讀取所有用戶 (管理員用)
    async function getAllUsersFromCloud() {
      try {
        const snapshot = await get(child(ref(db), `users`));
        return snapshot.exists() ? Object.values(snapshot.val()) : [];
      } catch (error) {
        return [];
      }
    }

    // 更新用戶
    async function updateUserInCloud(username, updates) {
      try {
        await update(ref(db, `users/${username}`), updates);
        if (currentUser && currentUser.username === username) {
          const updatedUser = { ...currentUser, ...updates };
          saveCurrentUserLocally(updatedUser);
        }
      } catch (error) {
        console.error("更新失敗:", error);
      }
    }

    // ========== 4. 業務邏輯與功能 ==========

    // 登入
    window.handleLogin = async function() {
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value.trim();
      
      const btn = document.querySelector('button[type="submit"]');
      btn.innerText = "登入中..."; btn.disabled = true;

      if (username === ADMIN_USERNAME && password === ADMIN_PASSWORD) {
        saveCurrentUserLocally({ username: ADMIN_USERNAME, isAdmin: true });
        currentPage = 'admin'; render(); return;
      }

      const user = await getUserFromCloud(username);
      if (user && user.password === password) {
        await updateUserInCloud(username, { last_login: new Date().toISOString() });
        user.last_login = new Date().toISOString(); // 本地也更新一下
        saveCurrentUserLocally(user);
        currentPage = 'home'; render();
      } else {
        showMessage('❌ 帳號或密碼錯誤！', '#ef4444');
        btn.innerText = "🔑 登入"; btn.disabled = false;
      }
    }

    // 註冊
    window.handleRegister = async function() {
      const username = document.getElementById('regUsername').value.trim();
      const password = document.getElementById('regPassword').value.trim();
      const displayName = document.getElementById('regDisplayName').value.trim();

      if (!username || !password) return;
      
      const existingUser = await getUserFromCloud(username);
      if (existingUser) {
        showMessage('❌ 此帳號已存在', '#ef4444'); return;
      }

      const newUser = {
        username, password, display_name: displayName,
        growth_progress: 0, total_nutrients: 0, games_completed: 0,
        completed_plants: 0, pesticides: 0, fertilizers: 0,
        medication_name: '', medication_time: '', medication_completed: false,
        created_at: new Date().toISOString()
      };

      await set(ref(db, 'users/' + username), newUser);
      showMessage('✅ 註冊成功！', '#10b981');
      setTimeout(() => { currentPage = 'login'; render(); }, 1500);
    }

    // 登出
    window.handleLogout = function() {
      currentUser = null;
      localStorage.removeItem(CURRENT_USER_KEY);
      currentPage = 'login'; render();
    }

    // 切換頁面
    window.switchPage = function(page) {
      currentPage = page; render();
    }

    // 刪除用戶
    window.deleteUser = async function(username) {
      if(confirm(`確定刪除 ${username}?`)) {
        await remove(ref(db, `users/${username}`));
        render(); // 重新渲染列表
      }
    }

    // 道具使用
    window.useItem = async function(type) {
      if (!currentUser || currentUser.isAdmin) return;
      const amount = type === 'pesticide' ? (currentUser.pesticides || 0) : (currentUser.fertilizers || 0);
      if (amount <= 0) return;

      vibrate(50);
      const progressInc = type === 'pesticide' ? 10 : 15;
      let newProgress = (currentUser.growth_progress || 0) + progressInc;
      
      const updates = { growth_progress: newProgress };
      updates[type === 'pesticide' ? 'pesticides' : 'fertilizers'] = amount - 1;

      if (newProgress >= 100) {
        vibrate([100, 50, 100]);
        updates.growth_progress = 0;
        updates.completed_plants = (currentUser.completed_plants || 0) + 1;
        showCenterMessage(`<div style="text-align:center"><div style="font-size:60px">🥕</div><div style="font-weight:bold">蘿蔔長大了！</div></div>`, '#10b981', 3000);
      } else {
        showMessage(type === 'pesticide' ? '🐛 除蟲成功 +10%' : '💩 施肥成功 +15%', '#10b981');
      }
      
      await updateUserInCloud(currentUser.username, updates);
      render();
    }

    // 獲得獎勵通用函數
    async function addReward(type) {
        if (!currentUser || currentUser.isAdmin) return;
        const updates = { games_completed: (currentUser.games_completed || 0) + 1 };
        updates[type === 'pesticide' ? 'pesticides' : 'fertilizers'] = (currentUser[type === 'pesticide' ? 'pesticides' : 'fertilizers'] || 0) + 1;
        await updateUserInCloud(currentUser.username, updates);
    }

    // ========== 5. 遊戲邏輯 ==========

    // --- A. 記憶遊戲 ---
    const MEMORY_FRUITS = ['🍎', '🍌', '🍊', '🍇', '🍓', '🍉'];
    window.startMemoryTest = function() {
      window.memoryState.phase = 'test'; window.memoryState.userSequence = []; render();
    }
    window.selectMemoryFruit = function(fruit) {
      const state = window.memoryState;
      if (!state || state.phase !== 'test') return;
      
      if (fruit === state.sequence[state.userSequence.length]) {
        state.userSequence.push(fruit);
        if (state.userSequence.length === state.sequence.length) {
          addReward('pesticide');
          showCenterMessage('🎉 恭喜答對！<br>獲得除蟲劑 🐛', '#10b981');
          setTimeout(() => { window.switchPage('games'); window.memoryState = null; }, 2000);
        } else {
          render();
        }
      } else {
        showCenterMessage('❌ 順序錯了<br>再試一次', '#ef4444');
        setTimeout(() => { window.switchPage('games'); window.memoryState = null; }, 1500);
      }
    }

    // --- B. 算術遊戲 (修正版：無負數 + 二選一按鈕) ---
    window.checkMathAnswer = function(selectedAnswer) {
      if (selectedAnswer === window.currentMathQuestion.answer) {
        window.mathProgress.correct++;
        window.currentMathQuestion = null; // 清空以產生下一題
        
        if (window.mathProgress.correct >= 3) {
          addReward('pesticide');
          showCenterMessage('🎉 算術挑戰成功！<br>獲得除蟲劑 🐛', '#10b981');
          setTimeout(() => { window.switchPage('games'); window.mathProgress = null; }, 2000);
        } else {
          render(); // 下一題
        }
      } else {
        vibrate(200);
        showCenterMessage('❌ 答錯了，再試一次', '#ef4444', 1000);
      }
    }

    // --- C. 配對遊戲 ---
    window.flipMatchCard = function(id) {
       const state = window.matchingState;
       if(state.processing) return;
       const card = window.matchingCards.find(c => c.id === id);
       if(card.matched || state.flipped.includes(id)) return;
       
       document.getElementById(`card-${id}`).classList.add('flipped');
       state.flipped.push(id);
       
       if(state.flipped.length === 2) {
          state.processing = true;
          const [id1, id2] = state.flipped;
          const c1 = window.matchingCards.find(c => c.id === id1);
          const c2 = window.matchingCards.find(c => c.id === id2);
          
          if(c1.fruit === c2.fruit) {
             setTimeout(() => {
                c1.matched = true; c2.matched = true;
                state.matches++;
                state.flipped = []; state.processing = false;
                render();
                if(state.matches === 4) {
                   addReward('pesticide');
                   showCenterMessage('🎉 完成配對！<br>獲得除蟲劑 🐛', '#10b981');
                   setTimeout(() => { window.switchPage('games'); }, 2000);
                }
             }, 600);
          } else {
             setTimeout(() => {
                document.getElementById(`card-${id1}`).classList.remove('flipped');
                document.getElementById(`card-${id2}`).classList.remove('flipped');
                state.flipped = []; state.processing = false;
             }, 1000);
          }
       }
    }

    // --- D. 公園尋寶 (Kahoot) ---
    const KAHOOT_QUESTIONS = [
      { question: "Q1：請問這裡會開什麼花？", options: ["🔶 玫瑰", "🟡 菊花", "🟥 櫻花"], colors: ["#ff9500", "#ffd700", "#dc143c"], answer: 2, image: "🌸" },
      { question: "Q2：這裡是哪裡？", options: ["🔶 超市", "🟡 醫院", "🟥 公園"], colors: ["#ff9500", "#ffd700", "#dc143c"], answer: 2, image: "🏞️" },
      { question: "Q3：請按下你看到的數字", options: ["20", "26"], colors: ["#3498db", "#2ecc71"], answer: 1, image: "🔢" },
      { question: "Q4：你今天做了哪個運動？", options: ["🔶 跑步", "🟡 游泳", "🟥 睡覺"], colors: ["#ff9500", "#ffd700", "#dc143c"], answer: 0, image: "🏃" },
      { question: "Q5：你在哪個公園？", options: ["🔶 大安", "🟡 中正", "🟥 安樂"], colors: ["#ff9500", "#ffd700", "#dc143c"], answer: 2, image: "🌳" }
    ];

    window.answerSurvey = function(index) {
       const state = window.surveyState;
       const q = KAHOOT_QUESTIONS[state.currentQuestion];
       state.selectedAnswer = index;
       state.showResult = true;
       if(index === q.answer) {
          vibrate(100);
          state.correctAnswers++;
          state.fertilizersEarned = (state.fertilizersEarned || 0) + 1;
       } else { vibrate(200); }
       render();
    };
    window.nextQuestion = function() {
       window.surveyState.currentQuestion++;
       window.surveyState.showResult = false;
       window.surveyState.selectedAnswer = null;
       render();
    };
    window.finishSurvey = async function() {
       if(currentUser && !currentUser.isAdmin) {
          const earned = window.surveyState.fertilizersEarned || 0;
          await update(ref(db, `users/${currentUser.username}/fertilizers`), (currentUser.fertilizers || 0) + earned);
          showCenterMessage(`獲得肥料 +${earned} 💩`, '#10b981');
       }
       window.surveyState = null;
       window.switchPage('parks');
    };

    // ========== 6. 渲染介面 (HTML Templates) ==========
    
    const defaultConfig = {
      primary: "#10b981", secondary: "#f0fdf4", text: "#1f2937", button: "#3b82f6", accent: "#fbbf24"
    };

    async function render() {
      const app = document.getElementById('app');
      
      // Admin 頁面需要等待數據
      if (currentPage === 'admin') {
         app.innerHTML = '<div class="h-full flex items-center justify-center text-2xl">載入數據中...</div>';
         const regularUsers = (await getAllUsersFromCloud()).filter(u => !u.isAdmin);
         app.innerHTML = renderAdmin(regularUsers);
         return;
      }
      
      // Home 頁面背景同步數據
      if (currentPage === 'home' && currentUser && !currentUser.isAdmin) {
         getUserFromCloud(currentUser.username).then(u => {
             if(u && (u.growth_progress !== currentUser.growth_progress || u.pesticides !== currentUser.pesticides)) {
                 currentUser = u; 
                 if(currentPage === 'home') app.innerHTML = renderHome();
             }
         });
      }

      let content = '';
      switch(currentPage) {
        case 'login': content = renderLogin(); break;
        case 'register': content = renderRegister(); break;
        case 'home': content = renderHome(); break;
        case 'games': content = renderGames(); break;
        case 'settings': content = renderSettings(); break;
        case 'survey': content = renderSurvey(); break;
        case 'memory': content = renderMemoryGame(); break;
        case 'math': content = renderMathGame(); break; 
        case 'matching': content = renderMatchingGame(); break;
        case 'parks': content = renderParks(); break;
        case 'health': content = renderHealth(); break;
        case 'emergency': content = renderEmergency(); break;
      }
      app.innerHTML = content;
    }

    function renderLogin() {
      return `
        <div class="min-h-full flex items-center justify-center p-4 bg-gradient-to-br from-green-500 to-blue-500">
          <div class="bg-white rounded-3xl shadow-2xl p-8 w-full max-w-md bounce-in">
            <div class="text-center mb-8">
              <div class="text-6xl mb-4">👴</div>
              <h1 class="font-bold mb-2" style="font-size: ${fontSize*2}px; color: ${defaultConfig.primary}">Grandpa GO</h1>
              <p style="font-size: ${fontSize}px;">長者健康互動平台</p>
            </div>
            <form onsubmit="event.preventDefault(); window.handleLogin();" class="space-y-6">
              <div><label class="block font-bold mb-2">帳號</label><input type="text" id="loginUsername" class="w-full p-3 border-2 rounded-xl" style="font-size: ${fontSize}px"></div>
              <div><label class="block font-bold mb-2">密碼</label><input type="password" id="loginPassword" class="w-full p-3 border-2 rounded-xl" style="font-size: ${fontSize}px"></div>
              <button type="submit" class="w-full py-4 rounded-xl font-bold text-white btn-scale" style="background:${defaultConfig.primary}; font-size:${fontSize*1.2}px">🔑 登入</button>
            </form>
            <div class="mt-6 text-center"><button onclick="window.switchPage('register')" class="text-blue-600 font-bold">註冊新帳號 →</button></div>
          </div>
        </div>`;
    }

    function renderRegister() {
      return `
        <div class="min-h-full flex items-center justify-center p-4 bg-gradient-to-br from-blue-500 to-green-500">
          <div class="bg-white rounded-3xl shadow-2xl p-8 w-full max-w-md bounce-in">
            <h1 class="font-bold mb-6 text-center" style="font-size: ${fontSize*1.8}px; color: ${defaultConfig.primary}">📝 新用戶註冊</h1>
            <form onsubmit="event.preventDefault(); window.handleRegister();" class="space-y-4">
              <div><label class="block font-bold">帳號</label><input type="text" id="regUsername" class="w-full p-3 border-2 rounded-xl"></div>
              <div><label class="block font-bold">密碼</label><input type="password" id="regPassword" class="w-full p-3 border-2 rounded-xl"></div>
              <div><label class="block font-bold">顯示名稱 (如: 王爺爺)</label><input type="text" id="regDisplayName" class="w-full p-3 border-2 rounded-xl"></div>
              <button type="submit" class="w-full py-4 rounded-xl font-bold text-white btn-scale" style="background:${defaultConfig.primary}; font-size:${fontSize*1.2}px">✅ 註冊</button>
            </form>
            <div class="mt-4 text-center"><button onclick="window.switchPage('login')" class="text-blue-600">← 返回登入</button></div>
          </div>
        </div>`;
    }

    function renderHome() {
      const p = currentUser.growth_progress || 0;
      return `
        <div class="min-h-full p-4 bg-green-50">
          <div class="max-w-4xl mx-auto bg-white rounded-3xl shadow-xl p-6 bounce-in">
            <div class="flex justify-between items-center mb-6">
              <div>
                <h1 class="font-bold" style="font-size: ${fontSize*1.5}px; color: ${defaultConfig.primary}">早安，${currentUser.display_name}！</h1>
                <p>🏆 已收成：${currentUser.completed_plants||0} 顆蘿蔔</p>
              </div>
              <button onclick="window.handleLogout()" class="px-4 py-2 bg-red-500 text-white rounded-lg font-bold">登出</button>
            </div>

            <div class="mb-6 p-6 rounded-2xl border-4 border-green-500 bg-green-50 text-center">
               <div style="font-size: ${fontSize*4}px" class="pulse-animation">${p<20?'🌱':p<50?'🌿':p<80?'🥬':'🥕'}</div>
               <div class="growth-bar bg-gray-200 h-8 mt-4"><div class="growth-fill bg-green-500 h-full flex items-center justify-center text-white font-bold" style="width:${p}%">${p}%</div></div>
               <div class="mt-4 grid grid-cols-2 gap-4">
                 <button onclick="window.useItem('pesticide')" class="p-3 bg-white border-2 border-blue-500 rounded-xl btn-scale" ${!currentUser.pesticides?'disabled opacity-50':''}>
                   <div class="text-2xl">🐛</div><div class="font-bold">除蟲劑 x${currentUser.pesticides||0}</div>
                 </button>
                 <button onclick="window.useItem('fertilizer')" class="p-3 bg-white border-2 border-green-500 rounded-xl btn-scale" ${!currentUser.fertilizers?'disabled opacity-50':''}>
                   <div class="text-2xl">💩</div><div class="font-bold">肥料 x${currentUser.fertilizers||0}</div>
                 </button>
               </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
               <button onclick="window.switchPage('health')" class="game-card p-4 bg-yellow-50 border-2 border-yellow-400 rounded-xl text-center">
                 <div class="text-4xl">💊</div><div class="font-bold mt-2" style="font-size:${fontSize}px">健康提醒</div>
               </button>
               <button onclick="window.switchPage('games')" class="game-card p-4 bg-blue-50 border-2 border-blue-400 rounded-xl text-center">
                 <div class="text-4xl">🎮</div><div class="font-bold mt-2" style="font-size:${fontSize}px">健腦遊戲</div>
               </button>
               <button onclick="window.switchPage('parks')" class="game-card p-4 bg-green-50 border-2 border-green-400 rounded-xl text-center">
                 <div class="text-4xl">🏞️</div><div class="font-bold mt-2" style="font-size:${fontSize}px">公園尋寶</div>
               </button>
               <button onclick="window.switchPage('emergency')" class="game-card p-4 bg-red-50 border-2 border-red-400 rounded-xl text-center">
                 <div class="text-4xl">🚨</div><div class="font-bold mt-2" style="font-size:${fontSize}px">緊急求助</div>
               </button>
            </div>
            
            <button onclick="window.switchPage('settings')" class="w-full mt-6 py-3 border-2 border-gray-300 rounded-xl font-bold">⚙️ 設定字體大小</button>
          </div>
        </div>`;
    }

    function renderGames() {
      return `
        <div class="min-h-full p-4 bg-blue-50">
          <div class="max-w-4xl mx-auto bg-white rounded-3xl shadow-xl p-8 bounce-in">
            <h1 class="text-center font-bold mb-8" style="font-size:${fontSize*1.8}px; color:${defaultConfig.button}">🎮 健腦遊戲挑戰</h1>
            <div class="grid md:grid-cols-3 gap-6">
               <div class="game-card p-6 border-4 border-green-500 rounded-2xl text-center" onclick="window.startMemoryTest(); window.switchPage('memory')">
                 <div class="text-6xl mb-2">🧠</div><h3 class="font-bold text-xl">記憶測試</h3><p class="text-gray-500">記住水果順序</p>
               </div>
               <div class="game-card p-6 border-4 border-blue-500 rounded-2xl text-center" onclick="window.mathProgress={correct:0, total:3}; window.currentMathQuestion=null; window.switchPage('math')">
                 <div class="text-6xl mb-2">🔢</div><h3 class="font-bold text-xl">算術挑戰</h3><p class="text-gray-500">簡單加減法</p>
               </div>
               <div class="game-card p-6 border-4 border-yellow-500 rounded-2xl text-center" onclick="window.startMatchingGame()">
                 <div class="text-6xl mb-2">🎴</div><h3 class="font-bold text-xl">配對遊戲</h3><p class="text-gray-500">找出相同圖片</p>
               </div>
            </div>
            <button onclick="window.switchPage('home')" class="w-full mt-8 py-4 bg-gray-500 text-white rounded-xl font-bold">🏠 返回首頁</button>
          </div>
        </div>`;
    }

    // --- 算術遊戲 (無負數 + 二選一按鈕) ---
    function renderMathGame() {
      if (!window.mathProgress) window.mathProgress = { correct: 0, total: 3 };
      
      if (!window.currentMathQuestion) {
        let a = Math.floor(Math.random() * 10) + 1; // 1~10
        let b = Math.floor(Math.random() * 10) + 1; // 1~10
        const isPlus = Math.random() > 0.5;
        const op = isPlus ? '+' : '-';
        
        // 修正：如果是減法，確保 a >= b (無負數)
        if (!isPlus && a < b) { const temp = a; a = b; b = temp; }
        
        const answer = isPlus ? a + b : a - b;
        
        // 產生錯誤選項 (正數，不等於答案)
        let wrong = answer + (Math.random() > 0.5 ? 1 : -1) * (Math.floor(Math.random() * 3) + 1);
        if (wrong < 0) wrong = 0;
        if (wrong === answer) wrong = answer + 1;

        window.currentMathQuestion = { a, b, op, answer, options: Math.random() > 0.5 ? [answer, wrong] : [wrong, answer] };
      }

      const q = window.currentMathQuestion;
      const progress = window.mathProgress;

      return `
        <div class="min-h-full p-4 bg-blue-50 flex items-center justify-center">
          <div class="w-full max-w-lg bg-white rounded-3xl shadow-xl p-8 bounce-in text-center">
            <h1 class="font-bold mb-4" style="font-size:${fontSize*1.5}px; color:${defaultConfig.button}">🔢 算術挑戰 (${progress.correct}/3)</h1>
            
            <div class="p-8 mb-8 bg-blue-100 rounded-2xl border-4 border-blue-400">
               <span class="font-bold" style="font-size: ${fontSize*3}px;">${q.a} ${q.op} ${q.b} = ?</span>
            </div>

            <p class="mb-4 text-gray-500" style="font-size:${fontSize}px">請點擊正確答案：</p>

            <div class="grid grid-cols-2 gap-6">
              ${q.options.map(opt => `
                <button onclick="window.checkMathAnswer(${opt})" 
                  class="py-6 rounded-2xl font-bold text-white shadow-lg btn-scale transition-transform transform hover:scale-105"
                  style="background: ${defaultConfig.button}; font-size: ${fontSize*2}px;">
                  ${opt}
                </button>
              `).join('')}
            </div>

            <button onclick="window.switchPage('games')" class="w-full mt-8 py-3 border-2 border-gray-300 rounded-xl text-gray-600 font-bold">放棄返回</button>
          </div>
        </div>
      `;
    }

    function renderMemoryGame() {
      const state = window.memoryState;
      if(!state) return '';
      return `
        <div class="min-h-full p-4 bg-green-50">
          <div class="max-w-3xl mx-auto bg-white rounded-3xl shadow-xl p-8 text-center bounce-in">
            <h1 class="font-bold mb-6" style="font-size:${fontSize*1.5}px; color:${defaultConfig.primary}">🧠 記憶測試</h1>
            ${state.phase === 'memorize' ? `
               <div class="mb-8 text-xl">請記住水果順序：</div>
               <div class="flex justify-center gap-4 mb-8 text-6xl">
                 ${state.sequence.map(f => `<div>${f}</div>`).join('')}
               </div>
               <button onclick="window.startMemoryTest()" class="w-full py-4 bg-green-500 text-white rounded-xl font-bold text-xl btn-scale">我記住了！</button>
            ` : `
               <div class="mb-8 text-xl">請按順序點擊：</div>
               <div class="flex justify-center gap-4 mb-8 min-h-[80px]">
                 ${state.userSequence.map(f => `<div class="text-6xl slide-up">${f}</div>`).join('')}
                 ${Array(4-state.userSequence.length).fill('<div class="w-16 h-16 bg-gray-200 rounded-lg"></div>').join('')}
               </div>
               <div class="grid grid-cols-3 gap-4 max-w-sm mx-auto">
                 ${MEMORY_FRUITS.map(f => `<button onclick="window.selectMemoryFruit('${f}')" class="p-4 text-4xl bg-white border-2 border-green-500 rounded-xl btn-scale">${f}</button>`).join('')}
               </div>
            `}
            <button onclick="window.switchPage('games')" class="mt-8 text-gray-500 underline">退出遊戲</button>
          </div>
        </div>`;
    }

    function renderMatchingGame() {
      return `
        <div class="min-h-full p-4 bg-yellow-50">
           <div class="max-w-2xl mx-auto bg-white rounded-3xl shadow-xl p-6 text-center bounce-in">
             <h1 class="font-bold mb-6" style="font-size:${fontSize*1.5}px; color:${defaultConfig.accent}">🎴 配對遊戲</h1>
             <div class="grid grid-cols-4 gap-3">
               ${window.matchingCards.map(c => `
                 <div id="card-${c.id}" class="match-card ${c.matched?'flipped':''}" onclick="window.flipMatchCard(${c.id})">
                   <div class="card-inner">
                     <div class="card-front bg-yellow-400 text-white border-4 border-yellow-500">?</div>
                     <div class="card-back bg-white border-4 border-yellow-500">${c.fruit}</div>
                   </div>
                 </div>
               `).join('')}
             </div>
             <button onclick="window.switchPage('games')" class="w-full mt-6 py-3 bg-gray-500 text-white rounded-xl font-bold">返回選單</button>
           </div>
        </div>`;
    }

    function renderAdmin(users) {
      return `
        <div class="min-h-full p-4 bg-gray-100">
          <div class="max-w-6xl mx-auto bg-white rounded-3xl shadow-xl p-8">
             <div class="flex justify-between mb-8">
               <h1 class="text-3xl font-bold text-gray-700">👨‍💼 管理員後台</h1>
               <button onclick="window.handleLogout()" class="px-6 py-2 bg-red-500 text-white rounded-lg">登出</button>
             </div>
             <div class="grid grid-cols-3 gap-4 mb-8 text-center">
                <div class="p-4 bg-blue-50 rounded-xl"><div class="text-3xl font-bold text-blue-600">${users.length}</div><div>總用戶</div></div>
                <div class="p-4 bg-green-50 rounded-xl"><div class="text-3xl font-bold text-green-600">${users.reduce((a,b)=>a+(b.completed_plants||0),0)}</div><div>蘿蔔總收成</div></div>
                <div class="p-4 bg-yellow-50 rounded-xl"><div class="text-3xl font-bold text-yellow-600">${users.reduce((a,b)=>a+(b.games_completed||0),0)}</div><div>遊戲完成次數</div></div>
             </div>
             <div class="space-y-4">
                ${users.map(u => `
                  <div class="p-4 border-2 border-gray-200 rounded-xl flex justify-between items-center hover:bg-gray-50">
                     <div>
                       <div class="font-bold text-xl">${u.display_name} (${u.username})</div>
                       <div class="text-gray-500 text-sm">最後登入: ${new Date(u.last_login).toLocaleString()}</div>
                       <div class="mt-2 text-sm">🌱 進度: ${u.growth_progress}% | 🥕 收成: ${u.completed_plants||0} | 💊 ${u.medication_name||'無用藥'}</div>
                     </div>
                     <button onclick="window.deleteUser('${u.username}')" class="px-4 py-2 border border-red-500 text-red-500 rounded hover:bg-red-50">刪除</button>
                  </div>
                `).join('')}
             </div>
          </div>
        </div>`;
    }

    function renderSettings() {
      return `
        <div class="min-h-full flex items-center justify-center p-4 bg-gray-100">
          <div class="bg-white rounded-3xl shadow-xl p-8 w-full max-w-md bounce-in">
             <h1 class="text-center font-bold mb-8" style="font-size:${fontSize*1.5}px">⚙️ 設定</h1>
             <label class="block mb-4 font-bold">字體大小: ${fontSize}px</label>
             <input type="range" min="14" max="30" value="${fontSize}" class="w-full h-4 bg-gray-200 rounded-lg appearance-none cursor-pointer" oninput="localStorage.setItem('${FONT_SIZE_KEY}', this.value); fontSize=parseInt(this.value); window.render();">
             <div class="mt-2 flex justify-between text-sm text-gray-500"><span>小</span><span>大</span></div>
             <button onclick="window.switchPage('home')" class="w-full mt-8 py-3 bg-blue-500 text-white rounded-xl font-bold">確定返回</button>
          </div>
        </div>`;
    }

    function renderEmergency() {
      return `
        <div class="min-h-full p-4 bg-red-50 text-center">
           <div class="max-w-md mx-auto bg-white rounded-3xl shadow-xl p-8 bounce-in">
             <h1 class="text-3xl font-bold text-red-600 mb-8">🚨 緊急求助</h1>
             <a href="tel:119" class="block py-8 mb-4 bg-red-600 text-white rounded-2xl text-3xl font-bold shadow-lg">🚑 撥打 119</a>
             <a href="tel:110" class="block py-8 mb-4 bg-blue-600 text-white rounded-2xl text-3xl font-bold shadow-lg">👮 撥打 110</a>
             <button onclick="window.switchPage('home')" class="w-full mt-4 py-3 border-2 border-gray-300 rounded-xl font-bold">返回</button>
           </div>
        </div>`;
    }

    function renderParks() {
       setTimeout(() => {
          if(document.getElementById('map') && !window.mapInit) {
             const map = L.map('map').setView([25.1276, 121.7392], 13);
             L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
             const PARKS = [
               { name: "中正公園", lat: 25.1380, lng: 121.7410, features: "海景、步道" },
               { name: "暖暖運動公園", lat: 25.0993, lng: 121.7392, features: "運動場、吊橋" },
               { name: "潮境公園", lat: 25.1432, lng: 121.8028, features: "飛天掃帚" }
             ];
             PARKS.forEach(p => L.marker([p.lat, p.lng]).addTo(map).bindPopup(`<b>${p.name}</b><br>${p.features}`));
             window.mapInit = true;
          }
       }, 100);

       return `
        <div class="min-h-full p-4 bg-green-50">
           <div class="max-w-4xl mx-auto bg-white rounded-3xl shadow-xl p-6 bounce-in">
              <h1 class="text-center font-bold mb-6" style="font-size:${fontSize*1.5}px; color:${defaultConfig.primary}">🏞️ 公園尋寶</h1>
              <button onclick="window.surveyState={currentQuestion:0,correctAnswers:0}; window.switchPage('survey')" class="w-full mb-6 py-4 bg-gradient-to-r from-pink-500 to-purple-500 text-white rounded-xl font-bold text-xl shadow-lg pulse-animation">📝 開始互動問答 (贏取肥料)</button>
              <div class="grid md:grid-cols-2 gap-4 h-[500px]">
                 <div class="overflow-y-auto space-y-3">
                   <div class="p-3 border-2 border-green-500 rounded-xl bg-green-50"><div class="font-bold text-lg">中正公園</div><div class="text-sm">海景、步道</div></div>
                   <div class="p-3 border-2 border-green-500 rounded-xl bg-green-50"><div class="font-bold text-lg">暖暖運動公園</div><div class="text-sm">運動場、吊橋</div></div>
                   <div class="p-3 border-2 border-green-500 rounded-xl bg-green-50"><div class="font-bold text-lg">潮境公園</div><div class="text-sm">飛天掃帚</div></div>
                 </div>
                 <div id="map" class="rounded-xl border-2 border-gray-300 h-full"></div>
              </div>
              <button onclick="window.switchPage('home')" class="w-full mt-6 py-3 bg-gray-500 text-white rounded-xl font-bold">返回首頁</button>
           </div>
        </div>`;
    }

    function renderHealth() {
       return `
        <div class="min-h-full p-4 bg-yellow-50">
           <div class="max-w-md mx-auto bg-white rounded-3xl shadow-xl p-8 bounce-in">
              <h1 class="text-center font-bold mb-6" style="font-size:${fontSize*1.5}px; color:${defaultConfig.accent}">💊 健康管理</h1>
              <div class="mb-6 p-4 bg-blue-50 border-l-4 border-blue-500">
                 <div class="font-bold text-lg">目前設定：</div>
                 <div>藥名：${currentUser.medication_name || '未設定'}</div>
                 <div>時間：${currentUser.medication_time || '未設定'}</div>
              </div>
              <form onsubmit="event.preventDefault(); window.saveMed()" class="space-y-4">
                 <div><label class="block font-bold">藥物名稱</label><input type="text" id="medName" value="${currentUser.medication_name||''}" class="w-full p-3 border-2 rounded-xl"></div>
                 <div><label class="block font-bold">提醒時間</label><input type="time" id="medTime" value="${currentUser.medication_time||''}" class="w-full p-3 border-2 rounded-xl"></div>
                 <button type="submit" class="w-full py-4 bg-yellow-500 text-white rounded-xl font-bold btn-scale">💾 儲存設定</button>
              </form>
              <button onclick="window.switchPage('home')" class="w-full mt-6 py-3 border-2 border-gray-300 rounded-xl font-bold">返回</button>
           </div>
        </div>`;
    }
    window.saveMed = async function() {
       await updateUserInCloud(currentUser.username, {
          medication_name: document.getElementById('medName').value,
          medication_time: document.getElementById('medTime').value
       });
       showMessage('✅ 設定已儲存', '#fbbf24');
    }

    function showMessage(msg, color) {
       const div = document.createElement('div');
       div.className = 'fixed top-10 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-xl text-white font-bold shadow-lg z-50 bounce-in';
       div.style.background = color;
       div.innerHTML = msg;
       document.body.appendChild(div);
       setTimeout(() => div.remove(), 2500);
    }
    function showCenterMessage(html, color, time=2000) {
       const div = document.createElement('div');
       div.className = 'fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 p-8 rounded-2xl text-white font-bold shadow-2xl z-50 bounce-in text-center';
       div.style.background = color;
       div.innerHTML = html;
       document.body.appendChild(div);
       setTimeout(() => div.remove(), time);
    }
    function vibrate(ms) { if(navigator.vibrate) navigator.vibrate(ms); }

    // 啟動
    window.render = render;
    render();

    // 藥物檢查 Loop
    setInterval(() => {
       if(currentUser && !currentUser.isAdmin && currentUser.medication_time) {
          const now = new Date();
          const timeStr = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
          if(timeStr === currentUser.medication_time && !document.getElementById('medAlert')) {
             const div = document.createElement('div');
             div.id = 'medAlert';
             div.innerHTML = `<div class="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-[100]"><div class="bg-white p-8 rounded-3xl text-center bounce-in"><div class="text-6xl mb-4">⏰</div><h2 class="text-2xl font-bold mb-4">該吃藥囉！</h2><p class="text-xl mb-6">${currentUser.medication_name}</p><button onclick="this.closest('#medAlert').remove(); window.useItem('fertilizer');" class="px-8 py-4 bg-green-500 text-white rounded-xl font-bold text-xl">✅ 我吃完了 (領取肥料)</button></div></div>`;
             document.body.appendChild(div);
          }
       }
    }, 15000);

  </script>
 </body>
