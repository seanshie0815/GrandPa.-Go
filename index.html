<!doctype html>
<html lang="zh-TW">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grandpa GO - 長者健康互動應用</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans TC', sans-serif;
    }
    
    html, body, #app {
      height: 100%;
      width: 100%;
      overflow-x: hidden;
    }
    
    .page-transition {
      animation: fadeIn 0.3s ease-in;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    .bounce-in {
      animation: bounceIn 0.5s ease-out;
    }
    
    @keyframes bounceIn {
      0% { transform: scale(0.9); opacity: 0; }
      50% { transform: scale(1.02); }
      100% { transform: scale(1); opacity: 1; }
    }
    
    .slide-up {
      animation: slideUp 0.4s ease-out;
    }
    
    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    
    .pulse-animation {
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    
    .btn-scale:active {
      transform: scale(0.95) !important;
    }
    
    .game-card {
      transition: all 0.3s ease;
    }
    
    .game-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    
    .match-card {
      width: 120px;
      height: 120px;
      perspective: 1000px;
      cursor: pointer;
    }
    
    .match-card .card-inner {
      width: 100%;
      height: 100%;
      transition: transform 0.6s;
      transform-style: preserve-3d;
      position: relative;
    }
    
    .match-card.flipped .card-inner {
      transform: rotateY(180deg);
    }
    
    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      font-size: 48px;
    }
    
    .card-back {
      transform: rotateY(180deg);
    }
    
    .growth-bar {
      position: relative;
      overflow: hidden;
      border-radius: 9999px;
    }
    
    .growth-fill {
      transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .kahoot-option {
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    
    .kahoot-option:active {
      transform: scale(0.95);
    }
    
    .kahoot-option::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.5);
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }
    
    .kahoot-option:active::before {
      width: 300px;
      height: 300px;
    }
    
    .leaderboard-entry {
      animation: slideInRight 0.5s ease-out;
    }
    
    @keyframes slideInRight {
      from {
        transform: translateX(-50px);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
  <script src="/_sdk/element_sdk.js" type="text/javascript"></script>
 </head>
 <body>
  <div id="app"></div>
  <script>
    // ========== localStorage 資料管理系統 ==========
    const STORAGE_KEY = 'grandpa_go_users';
    const CURRENT_USER_KEY = 'grandpa_go_current_user';
    const FONT_SIZE_KEY = 'grandpa_go_font_size';
    
    // 從 localStorage 載入所有使用者
    function loadUsersFromStorage() {
      try {
        const data = localStorage.getItem(STORAGE_KEY);
        return data ? JSON.parse(data) : [];
      } catch (error) {
        console.error('載入使用者資料失敗:', error);
        return [];
      }
    }
    
    // 儲存所有使用者到 localStorage
    function saveUsersToStorage(users) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(users));
        return true;
      } catch (error) {
        console.error('儲存使用者資料失敗:', error);
        return false;
      }
    }
    
    // 儲存當前登入使用者
    function saveCurrentUser(user) {
      try {
        localStorage.setItem(CURRENT_USER_KEY, JSON.stringify(user));
      } catch (error) {
        console.error('儲存當前使用者失敗:', error);
      }
    }
    
    // 載入當前登入使用者
    function loadCurrentUser() {
      try {
        const data = localStorage.getItem(CURRENT_USER_KEY);
        return data ? JSON.parse(data) : null;
      } catch (error) {
        console.error('載入當前使用者失敗:', error);
        return null;
      }
    }
    
    // 清除當前登入使用者
    function clearCurrentUser() {
      localStorage.removeItem(CURRENT_USER_KEY);
    }
    
    // 更新使用者資料
    function updateUserInStorage(username, updates) {
      const users = loadUsersFromStorage();
      const userIndex = users.findIndex(u => u.username === username);
      
      if (userIndex !== -1) {
        users[userIndex] = { ...users[userIndex], ...updates };
        saveUsersToStorage(users);
        
        // 如果是當前使用者，也更新當前使用者快取
        const currentUser = loadCurrentUser();
        if (currentUser && currentUser.username === username) {
          saveCurrentUser(users[userIndex]);
        }
        
        return users[userIndex];
      }
      return null;
    }
    
    // 建立新使用者
    function createUserInStorage(userData) {
      const users = loadUsersFromStorage();
      
      // 檢查是否已存在
      if (users.find(u => u.username === userData.username)) {
        return { success: false, message: '此帳號已存在' };
      }
      
      // 新增使用者
      const newUser = {
        ...userData,
        created_at: new Date().toISOString(),
        last_login: new Date().toISOString()
      };
      
      users.push(newUser);
      
      if (saveUsersToStorage(users)) {
        return { success: true, user: newUser };
      } else {
        return { success: false, message: '儲存失敗' };
      }
    }
    
    // 刪除使用者
    function deleteUserFromStorage(username) {
      const users = loadUsersFromStorage();
      const filteredUsers = users.filter(u => u.username !== username);
      return saveUsersToStorage(filteredUsers);
    }
    
    // ========== 應用程式主邏輯 ==========
    
    let allUsers = loadUsersFromStorage();
    let currentUser = loadCurrentUser();
    let currentPage = currentUser ? (currentUser.isAdmin ? 'admin' : 'home') : 'login';
    let fontSize = parseInt(localStorage.getItem(FONT_SIZE_KEY)) || 16;
    
    const ADMIN_USERNAME = 'admin';
    const ADMIN_PASSWORD = 'admin';
    
    const KAHOOT_QUESTIONS = [
      {
        question: "Q1：請問這裡會開什麼花？",
        options: ["🔶", "🟡", "🟥"],
        colors: ["#ff9500", "#ffd700", "#dc143c"],
        answer: 2,
        image: "🌸"
      },
      {
        question: "Q2：這裡是哪裡？",
        options: ["🔶", "🟡", "🟥"],
        colors: ["#ff9500", "#ffd700", "#dc143c"],
        answer: 2,
        image: "🏞️"
      },
      {
        question: "Q3：請按下你看到的數字",
        options: ["20", "26"],
        colors: ["#3498db", "#2ecc71"],
        answer: 1,
        image: "🔢"
      },
      {
        question: "Q4：你/妳今天做了哪個運動？",
        options: ["🔶", "🟡", "🟥"],
        colors: ["#ff9500", "#ffd700", "#dc143c"],
        answer: 0,
        image: "🏃"
      },
      {
        question: "Q5：你/妳現在在哪個公園？",
        options: ["🔶", "🟡", "🟥"],
        colors: ["#ff9500", "#ffd700", "#dc143c"],
        answer: 2,
        image: "🌳"
      }
    ];
    
    const PARKS = [
      { id: 1, name: "中正公園", rating: 4.8, features: "海景、步道、健身器材", lat: 25.1380, lng: 121.7410 },
      { id: 2, name: "暖暖運動公園", rating: 4.5, features: "運動場、籃球場、兒童遊樂區", lat: 25.0993, lng: 121.7392 },
      { id: 3, name: "安樂公園", rating: 4.3, features: "綠地、涼亭、散步道", lat: 25.1289, lng: 121.7268 },
      { id: 4, name: "七堵鐵道公園", rating: 4.6, features: "鐵道文化、休憩廣場", lat: 25.0938, lng: 121.7115 }
    ];
    
    const MEMORY_FRUITS = ['🍎', '🍌', '🍊', '🍇', '🍓', '🍉'];
    
    const defaultConfig = {
      app_title: "Grandpa GO",
      welcome_message: "歡迎回來",
      games_section_title: "健腦遊戲挑戰",
      progress_label: "蘿蔔苗成長進度",
      survey_button_text: "🏞️ 公園尋寶 Kahoot",
      park_section_title: "基隆公園推薦",
      health_section_title: "健康管理中心",
      emergency_title: "緊急求助專線",
      primary_color: "#10b981",
      secondary_color: "#f0fdf4",
      text_color: "#1f2937",
      button_color: "#3b82f6",
      accent_color: "#fbbf24"
    };
    
    // 檢查服藥提醒
    function checkMedicationReminder() {
      if (!currentUser || currentUser.isAdmin) return;
      
      // 重新從 storage 載入使用者資料
      const users = loadUsersFromStorage();
      const userData = users.find(u => u.username === currentUser.username);
      
      if (!userData || !userData.medication_name || !userData.medication_time) return;
      
      const now = new Date();
      const today = now.toLocaleDateString('zh-TW');
      
      if (userData.medication_completed && userData.medication_date === today) return;
      
      const [hours, minutes] = userData.medication_time.split(':');
      const medicationTime = new Date();
      medicationTime.setHours(parseInt(hours), parseInt(minutes), 0);
      
      const hoursDiff = (now - medicationTime) / (1000 * 60 * 60);
      
      if (hoursDiff >= 0 && hoursDiff <= 1) {
        if (!document.getElementById('medicationOverlay')) {
          showMedicationReminder(userData);
        }
      }
    }
    
    function showMedicationReminder(userData) {
      const overlay = document.createElement('div');
      overlay.id = 'medicationOverlay';
      overlay.style.cssText = `
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.8);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10000;
        animation: fadeIn 0.3s ease-in;
      `;
      
      overlay.innerHTML = `
        <div style="background: white; padding: 32px; border-radius: 24px; max-width: 400px; text-align: center; animation: bounceIn 0.5s ease-out;">
          <div style="font-size: 64px; margin-bottom: 16px;">⏰</div>
          <h2 style="font-size: ${fontSize * 1.5}px; font-weight: bold; color: ${defaultConfig.primary_color}; margin-bottom: 16px;">服藥提醒</h2>
          <p style="font-size: ${fontSize * 1.1}px; margin-bottom: 8px;">💊 ${userData.medication_name}</p>
          <p style="font-size: ${fontSize}px; color: #6b7280; margin-bottom: 24px;">現在是 ${userData.medication_time} 該服藥的時間了！</p>
          <button onclick="confirmMedication()" style="background: ${defaultConfig.primary_color}; color: white; padding: 16px 32px; border-radius: 12px; font-size: ${fontSize * 1.2}px; font-weight: bold; border: none; cursor: pointer; width: 100%;">
            ✅ 確認已服藥（肥料一包 💩）
          </button>
        </div>
      `;
      
      document.body.appendChild(overlay);
    }
    
    function handleLogin(username, password) {
      const trimmedUsername = (username || '').trim();
      const trimmedPassword = (password || '').trim();
      
      if (trimmedUsername === ADMIN_USERNAME && trimmedPassword === ADMIN_PASSWORD) {
        currentUser = { username: ADMIN_USERNAME, isAdmin: true };
        saveCurrentUser(currentUser);
        currentPage = 'admin';
        render();
        return;
      }
      
      allUsers = loadUsersFromStorage();
      const user = allUsers.find(u => u.username === trimmedUsername && u.password === trimmedPassword);
      
      if (user) {
        user.last_login = new Date().toISOString();
        updateUserInStorage(user.username, { last_login: user.last_login });
        
        currentUser = user;
        saveCurrentUser(currentUser);
        currentPage = 'home';
        render();
      } else {
        showMessage('❌ 帳號或密碼錯誤！', '#ef4444');
      }
    }
    
    function handleRegister(username, password, displayName) {
      const newUser = {
        username,
        password,
        display_name: displayName,
        growth_progress: 0,
        total_nutrients: 0,
        games_completed: 0,
        completed_plants: 0,
        pesticides: 0,
        fertilizers: 0,
        medication_name: '',
        medication_time: '',
        medication_completed: false,
        medication_date: ''
      };
      
      const result = createUserInStorage(newUser);
      
      if (result.success) {
        showMessage('✅ 註冊成功！請登入', defaultConfig.primary_color);
        setTimeout(() => {
          currentPage = 'login';
          render();
        }, 2000);
      } else {
        showMessage('❌ ' + result.message, '#ef4444');
      }
    }
    
    function handleLogout() {
      currentUser = null;
      clearCurrentUser();
      currentPage = 'login';
      render();
    }
    
    function deleteUser(username) {
      if (deleteUserFromStorage(username)) {
        allUsers = loadUsersFromStorage();
        showMessage('✅ 用戶已刪除', defaultConfig.primary_color);
        render();
      }
    }
    
    function addPesticide() {
      if (!currentUser || currentUser.isAdmin) return;
      
      const updates = {
        pesticides: (currentUser.pesticides || 0) + 1,
        games_completed: (currentUser.games_completed || 0) + 1
      };
      
      const updatedUser = updateUserInStorage(currentUser.username, updates);
      if (updatedUser) {
        currentUser = updatedUser;
        allUsers = loadUsersFromStorage();
        return true;
      }
      return false;
    }
    
    function addFertilizer() {
      if (!currentUser || currentUser.isAdmin) return;
      
      const updates = {
        fertilizers: (currentUser.fertilizers || 0) + 1,
        games_completed: (currentUser.games_completed || 0) + 1
      };
      
      const updatedUser = updateUserInStorage(currentUser.username, updates);
      if (updatedUser) {
        currentUser = updatedUser;
        allUsers = loadUsersFromStorage();
        return true;
      }
      return false;
    }
    
    function showMessage(message, bgColor) {
      const msg = document.createElement('div');
      msg.textContent = message;
      msg.style.cssText = `position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: ${bgColor}; color: white; padding: 16px 32px; border-radius: 12px; font-size: ${fontSize * 1.2}px; font-weight: bold; z-index: 10000;`;
      document.body.appendChild(msg);
      setTimeout(() => msg.remove(), 3000);
    }
    
    function showCenterMessage(html, bgColor, duration = 2000) {
      const msg = document.createElement('div');
      msg.innerHTML = html;
      msg.style.cssText = `position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: ${bgColor}; color: white; padding: 30px 50px; border-radius: 20px; font-size: ${fontSize}px; z-index: 10000; box-shadow: 0 10px 40px rgba(0,0,0,0.3);`;
      document.body.appendChild(msg);
      setTimeout(() => msg.remove(), duration);
    }
    
    function vibrate(pattern) {
      if (navigator.vibrate) {
        navigator.vibrate(pattern);
      }
    }
    
    // ========== 渲染函數 ==========
    
    function renderLogin() {
      return `
        <div class="min-h-full flex items-center justify-center p-4" style="background: linear-gradient(135deg, ${defaultConfig.primary_color} 0%, ${defaultConfig.button_color} 100%);">
          <div class="bg-white rounded-3xl shadow-2xl p-8 w-full max-w-md bounce-in">
            <div class="text-center mb-8">
              <div class="text-6xl mb-4">👴</div>
              <h1 class="font-bold mb-2 pulse-animation" style="font-size: ${fontSize * 2}px; color: ${defaultConfig.primary_color};">
                ${defaultConfig.app_title}
              </h1>
              <p style="font-size: ${fontSize}px; color: ${defaultConfig.text_color};">長者健康互動平台</p>
            </div>
            
            <form id="loginForm" class="space-y-6">
              <div class="slide-up">
                <label for="loginUsername" class="block font-semibold mb-2" style="color: ${defaultConfig.text_color}; font-size: ${fontSize}px;">帳號</label>
                <input type="text" id="loginUsername" required 
                  class="w-full px-4 py-3 border-2 rounded-xl focus:outline-none"
                  style="font-size: ${fontSize}px; border-color: ${defaultConfig.primary_color};"
                  placeholder="請輸入帳號">
              </div>
              
              <div class="slide-up" style="animation-delay: 0.1s;">
                <label for="loginPassword" class="block font-semibold mb-2" style="color: ${defaultConfig.text_color}; font-size: ${fontSize}px;">密碼</label>
                <input type="password" id="loginPassword" required 
                  class="w-full px-4 py-3 border-2 rounded-xl focus:outline-none"
                  style="font-size: ${fontSize}px; border-color: ${defaultConfig.primary_color};"
                  placeholder="請輸入密碼">
              </div>
              
              <button type="submit" 
                class="w-full py-4 rounded-xl font-bold text-white transition-all transform hover:scale-105 btn-scale slide-up"
                style="background: ${defaultConfig.primary_color}; font-size: ${fontSize * 1.2}px; animation-delay: 0.2s;">
                🔑 登入
              </button>
            </form>
            
            <div class="mt-6 text-center slide-up" style="animation-delay: 0.3s;">
              <button onclick="currentPage='register'; render();" 
                class="text-blue-600 font-semibold hover:underline"
                style="font-size: ${fontSize}px;">
                還沒有帳號？立即註冊 →
              </button>
            </div>
          </div>
        </div>
      `;
    }
    
    function renderRegister() {
      return `
        <div class="min-h-full flex items-center justify-center p-4" style="background: linear-gradient(135deg, ${defaultConfig.button_color} 0%, ${defaultConfig.primary_color} 100%);">
          <div class="bg-white rounded-3xl shadow-2xl p-8 w-full max-w-md bounce-in">
            <div class="text-center mb-8">
              <div class="text-6xl mb-4">📝</div>
              <h1 class="font-bold mb-2" style="font-size: ${fontSize * 2}px; color: ${defaultConfig.primary_color};">新用戶註冊</h1>
              <p style="font-size: ${fontSize}px; color: ${defaultConfig.text_color};">加入 Grandpa GO 開始健康生活</p>
            </div>
            
            <form id="registerForm" class="space-y-6">
              <div class="slide-up">
                <label for="regUsername" class="block font-semibold mb-2" style="color: ${defaultConfig.text_color}; font-size: ${fontSize}px;">帳號</label>
                <input type="text" id="regUsername" required 
                  class="w-full px-4 py-3 border-2 rounded-xl focus:outline-none"
                  style="font-size: ${fontSize}px; border-color: ${defaultConfig.primary_color};"
                  placeholder="請設定帳號">
              </div>
              
              <div class="slide-up" style="animation-delay: 0.1s;">
                <label for="regPassword" class="block font-semibold mb-2" style="color: ${defaultConfig.text_color}; font-size: ${fontSize}px;">密碼</label>
                <input type="password" id="regPassword" required 
                  class="w-full px-4 py-3 border-2 rounded-xl focus:outline-none"
                  style="font-size: ${fontSize}px; border-color: ${defaultConfig.primary_color};"
                  placeholder="請設定密碼">
              </div>
              
              <div class="slide-up" style="animation-delay: 0.2s;">
                <label for="regDisplayName" class="block font-semibold mb-2" style="color: ${defaultConfig.text_color}; font-size: ${fontSize}px;">顯示名稱</label>
                <input type="text" id="regDisplayName" required 
                  class="w-full px-4 py-3 border-2 rounded-xl focus:outline-none"
                  style="font-size: ${fontSize}px; border-color: ${defaultConfig.primary_color};"
                  placeholder="例如：王大明">
              </div>
              
              <button type="submit" 
                class="w-full py-4 rounded-xl font-bold text-white transition-all transform hover:scale-105 btn-scale slide-up"
                style="background: ${defaultConfig.primary_color}; font-size: ${fontSize * 1.2}px; animation-delay: 0.3s;">
                ✅ 註冊
              </button>
            </form>
            
            <div class="mt-6 text-center slide-up" style="animation-delay: 0.4s;">
              <button onclick="currentPage='login'; render();" 
                class="text-blue-600 font-semibold hover:underline"
                style="font-size: ${fontSize}px;">
                ← 返回登入
              </button>
            </div>
          </div>
        </div>
      `;
    }
    
    function renderAdmin() {
      allUsers = loadUsersFromStorage();
      const regularUsers = allUsers.filter(u => !u.isAdmin);
      
      return `
        <div class="min-h-full p-4" style="background: ${defaultConfig.secondary_color};">
          <div class="max-w-6xl mx-auto">
            <div class="bg-white rounded-3xl shadow-2xl p-8 bounce-in">
              <div class="flex justify-between items-center mb-8">
                <h1 class="font-bold pulse-animation" style="font-size: ${fontSize * 2}px; color: ${defaultConfig.primary_color};">👨‍💼 管理員後台</h1>
                <button onclick="handleLogout()" 
                  class="px-6 py-3 rounded-xl font-bold text-white transition-all transform hover:scale-105 btn-scale"
                  style="background: #ef4444; font-size: ${fontSize}px;">
                  🚪 登出
                </button>
              </div>
              
              <div class="mb-6 p-6 rounded-xl" style="background: ${defaultConfig.secondary_color}; border: 3px solid ${defaultConfig.primary_color};">
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                  <div class="text-center">
                    <div style="font-size: ${fontSize * 2.5}px; font-weight: bold; color: ${defaultConfig.primary_color};">${regularUsers.length}</div>
                    <div style="font-size: ${fontSize}px; color: ${defaultConfig.text_color};">註冊用戶數</div>
                  </div>
                  <div class="text-center">

          </div>

      `;

    function renderSurvey() {
      if (!window.surveyState) {
        window.surveyState = { 
          currentQuestion: 0, 
          correctAnswers: 0,
          fertilizersEarned: 0
        };
      }
      
      const state = window.surveyState;
      const question = KAHOOT_QUESTIONS[state.currentQuestion];
      
      if (state.showResult) {
        const isCorrect = state.selectedAnswer === question.answer;
        
        return `
          <div class="min-h-full flex items-center justify-center p-4" style="background: ${isCorrect ? '#10b981' : '#ef4444'};">
            <div class="bg-white rounded-3xl shadow-2xl p-12 max-w-2xl text-center bounce-in">
              <div style="font-size: 96px; margin-bottom: 24px;">${isCorrect ? '✅' : '❌'}</div>
              <h1 class="font-bold mb-4" style="font-size: ${fontSize * 2}px; color: ${isCorrect ? defaultConfig.primary_color : '#ef4444'};">
                ${isCorrect ? '恭喜答對！' : '答錯了！'}
              </h1>
              ${!isCorrect ? `
                <p style="font-size: ${fontSize * 1.2}px; color: ${defaultConfig.text_color}; margin-bottom: 16px;">
                  正確答案：${question.options[question.answer]}
                </p>
              ` : ''}
              ${isCorrect ? `
                <p style="font-size: ${fontSize * 1.5}px; color: ${defaultConfig.accent_color}; font-weight: bold; margin-bottom: 32px;">
                  獲得：肥料一包 💩
                </p>
              ` : ''}
              <button onclick="window.nextQuestion()" 
                class="w-full py-6 rounded-xl font-bold text-white transition-all transform hover:scale-105 btn-scale"
                style="background: ${defaultConfig.button_color}; font-size: ${fontSize * 1.3}px;">
                ${state.currentQuestion < KAHOOT_QUESTIONS.length - 1 ? '繼續下一題 →' : '查看最終成績 🏆'}
              </button>
            </div>
          </div>
        `;
      }
      
      if (state.currentQuestion >= KAHOOT_QUESTIONS.length) {
        const totalFertilizers = state.fertilizersEarned || 0;
        
        return `
          <div class="min-h-full flex items-center justify-center p-4" style="background: linear-gradient(135deg, ${defaultConfig.primary_color} 0%, ${defaultConfig.button_color} 100%);">
            <div class="bg-white rounded-3xl shadow-2xl p-12 max-w-3xl text-center bounce-in">
              <div style="font-size: 96px; margin-bottom: 24px;">🏆</div>
              <h1 class="font-bold mb-4" style="font-size: ${fontSize * 2.5}px; color: ${defaultConfig.primary_color};">
                公園尋寶完成！
              </h1>
              
              <div class="mb-8 p-8 rounded-xl" style="background: ${defaultConfig.secondary_color}; border: 4px solid ${defaultConfig.primary_color};">
                <p style="font-size: ${fontSize * 1.2}px; color: ${defaultConfig.text_color}; margin-bottom: 16px;">
                  答對 ${state.correctAnswers} / ${KAHOOT_QUESTIONS.length} 題
                </p>
                <div class="p-6 rounded-lg" style="background: white; border: 2px solid ${defaultConfig.primary_color};">
                  <div style="font-size: ${fontSize * 3}px; margin-bottom: 12px;">💩</div>
                  <div style="font-size: ${fontSize * 1.5}px; font-weight: bold; color: ${defaultConfig.text_color};">
                    肥料 × ${totalFertilizers}
                  </div>
                </div>
              </div>
              
              <button onclick="window.finishSurvey()" 
                class="w-full py-6 rounded-xl font-bold text-white transition-all transform hover:scale-105 btn-scale"
                style="background: ${defaultConfig.primary_color}; font-size: ${fontSize * 1.3}px;">
                🎁 領取獎勵並返回
              </button>
            </div>
          </div>
        `;
      }
      
      return `
        <div class="min-h-full p-4 page-transition" style="background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);">
          <div class="max-w-4xl mx-auto">
            <div class="bg-white rounded-3xl shadow-2xl p-8 bounce-in">
              <div class="mb-6 flex justify-center">
                <span class="px-6 py-3 rounded-full" style="background: ${defaultConfig.primary_color}; color: white; font-size: ${fontSize}px; font-weight: bold;">
                  題目 ${state.currentQuestion + 1} / ${KAHOOT_QUESTIONS.length}
                </span>
              </div>
              
              <div class="mb-8 p-8 rounded-xl text-center slide-up" style="background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%); color: white;">
                <div style="font-size: ${fontSize * 6}px; margin-bottom: 16px;">${question.image}</div>
                <h2 class="font-bold" style="font-size: ${fontSize * 1.8}px;">
                  ${question.question}
                </h2>
              </div>
              
              <div class="grid grid-cols-1 ${question.options.length === 2 ? 'md:grid-cols-2' : 'md:grid-cols-2'} gap-6 mb-6">
                ${question.options.map((option, index) => `
                  <button onclick="window.answerSurvey(${index})" 
                    class="kahoot-option p-8 rounded-2xl font-bold text-left transition-all transform hover:scale-105 slide-up"
                    style="background: ${question.colors[index]}; color: white; font-size: ${fontSize * 1.8}px; animation-delay: ${index * 0.1}s; min-height: 120px; display: flex; align-items: center; justify-content: center; text-align: center;">
                    ${option}
                  </button>
                `).join('')}
              </div>
              
              <div class="text-center">
                <p style="font-size: ${fontSize * 0.9}px; color: #6b7280;">
                  💡 仔細思考後選擇答案
                </p>
              </div>
            </div>
          </div>

      if (isCorrect) {
        vibrate([100, 50, 100]);
        state.correctAnswers += 1;
        state.fertilizersEarned = (state.fertilizersEarned || 0) + 1;
      } else {
        vibrate([200]);

      state.showResult = true;
      render();

    function renderMatchingGame() {

              <h1 class="font-bold mb-6 text-center pulse-animation" style="font-size: ${fontSize * 2}px; color: ${defaultConfig.primary_color};">🎴 配對遊戲</h1>
              
              <div class="mb-6 text-center">
                <span class="px-6 py-3 rounded-full" style="background: ${defaultConfig.secondary_color}; font-size: ${fontSize * 1.2}px; font-weight: bold; color: ${defaultConfig.text_color}; border: 3px solid ${defaultConfig.primary_color};">

    window.selectMemoryFruit = function(fruit) {
      if (!window.memoryState || window.memoryState.phase !== 'test') return;
      
      const expectedIndex = window.memoryState.userSequence.length;
      const expectedFruit = window.memoryState.sequence[expectedIndex];
      
      if (fruit === expectedFruit) {
        window.memoryState.userSequence.push(fruit);
        
        if (window.memoryState.userSequence.length === window.memoryState.sequence.length) {
          addPesticide();
          
          showCenterMessage(`
            <div style="text-align: center;">
              <div style="font-size: ${fontSize * 3}px; margin-bottom: 10px;">🎉</div>

              <div style="font-size: ${fontSize}px; margin-top: 8px;">獲得除蟲劑一次 🐛</div>
            </div>

          setTimeout(() => {
            currentPage = 'games';

          }, 2000);
        } else {

        }

        showCenterMessage(`
          <div style="text-align: center;">

        setTimeout(() => {
          currentPage = 'games';
          window.memoryState = null;
          render();
        }, 2000);
      }
    };
    
    window.flipMatchCard = function(cardId) {
      const card = window.matchingCards.find(c => c.id === cardId);
      if (!card || card.matched) return;
      
      if (window.matchingState.flipped.includes(cardId)) return;
      if (window.matchingState.flipped.length >= 2) return;
      if (window.matchingState.processing) return;
      
      const cardElement = document.getElementById(`card-${cardId}`);
      cardElement.classList.add('flipped');
      window.matchingState.flipped.push(cardId);
      
      if (window.matchingState.flipped.length === 2) {
        window.matchingState.processing = true;
        
        const [id1, id2] = window.matchingState.flipped;
        const card1 = window.matchingCards.find(c => c.id === id1);
        const card2 = window.matchingCards.find(c => c.id === id2);
        
        if (card1.fruit === card2.fruit) {
          setTimeout(() => {
            card1.matched = true;
            card2.matched = true;
            window.matchingState.matches += 1;
            window.matchingState.flipped = [];
            window.matchingState.processing = false;
            
            const card1El = document.getElementById(`card-${id1}`);
            const card2El = document.getElementById(`card-${id2}`);
            if (card1El && card2El) {
              card1El.querySelector('.card-back').style.borderColor = defaultConfig.accent_color;
              card2El.querySelector('.card-back').style.borderColor = defaultConfig.accent_color;
            }
            
            if (window.matchingState.matches === 4) {
              setTimeout(() => {
                addPesticide();
                
                showCenterMessage(`
                  <div style="text-align: center;">
                    <div style="font-size: ${fontSize * 3}px; margin-bottom: 10px;">🎉</div>
                    <div style="font-size: ${fontSize * 1.8}px; font-weight: bold;">恭喜答對！</div>
                    <div style="font-size: ${fontSize}px; margin-top: 8px;">獲得除蟲劑一次 🐛</div>
                  </div>
                `, defaultConfig.primary_color);
                
                setTimeout(() => {
                  currentPage = 'games';
                  window.matchingCards = null;
                  window.matchingState = null;
                  render();
                }, 2000);
              }, 500);
            }
          }, 600);
        } else {
          setTimeout(() => {
            const card1El = document.getElementById(`card-${id1}`);
            const card2El = document.getElementById(`card-${id2}`);
            if (card1El && card2El) {
              card1El.classList.remove('flipped');
              card2El.classList.remove('flipped');
            }
            window.matchingState.flipped = [];
            window.matchingState.processing = false;
          }, 1000);
        }
      }
    };
    
    window.checkMathAnswer = function() {
      const userAnswer = document.getElementById('mathAnswer').value;
      if (parseInt(userAnswer) === window.currentMathQuestion.answer) {
        window.mathProgress.correct += 1;
        window.currentMathQuestion = null;
        
        if (window.mathProgress.correct >= 3) {
          addPesticide();
          
          showCenterMessage(`

              <div style="font-size: ${fontSize * 1.8}px; font-weight: bold;">恭喜答對！</div>

          `, defaultConfig.primary_color);
          
          setTimeout(() => {
            currentPage = 'games';
            window.mathProgress = null;
            window.currentMathQuestion = null;
            render();
          }, 2000);
        } else {
          render();
        }
      } else {
        const answerInput = document.getElementById('mathAnswer');
        answerInput.value = '';
        answerInput.style.borderColor = '#ef4444';
        setTimeout(() => {
          answerInput.style.borderColor = defaultConfig.primary_color;
        }, 1000);
      }
    };

              <button onclick="currentPage='home'; render();" 
                class="w-full py-4 rounded-xl font-bold text-white transition-all transform hover:scale-105 btn-scale"
                style="background: ${defaultConfig.button_color}; font-size: ${fontSize * 1.1}px;">
                🏠 返回首頁
              </button>
            </div>
          </div>
        </div>
      `;
    }
    
    function renderEmergency() {
      return `
        <div class="min-h-full p-4 page-transition" style="background: ${defaultConfig.secondary_color};">
          <div class="max-w-3xl mx-auto">
            <div class="bg-white rounded-3xl shadow-2xl p-8 bounce-in">
              <h1 class="font-bold mb-8 text-center pulse-animation" style="font-size: ${fontSize * 2}px; color: #ef4444;">🚨 ${defaultConfig.emergency_title}</h1>
              
              <div class="space-y-6">
                <a href="tel:119" 
                  class="block py-12 rounded-xl font-bold text-white text-center transition-all transform hover:scale-105 btn-scale slide-up"
                  style="background: #ef4444; font-size: ${fontSize * 2}px; text-decoration: none;">
                  🚑 撥打 119<br>
                  <span style="font-size: ${fontSize * 1.2}px;">救護車 / 消防局</span>
                </a>
                
                <a href="tel:110" 
                  class="block py-12 rounded-xl font-bold text-white text-center transition-all transform hover:scale-105 btn-scale slide-up"
                  style="background: #3b82f6; font-size: ${fontSize * 2}px; text-decoration: none; animation-delay: 0.1s;">
                  👮 撥打 110<br>
                  <span style="font-size: ${fontSize * 1.2}px;">警察局</span>
                </a>
                
                <a href="tel:1966" 
                  class="block py-12 rounded-xl font-bold text-white text-center transition-all transform hover:scale-105 btn-scale slide-up"
                  style="background: #10b981; font-size: ${fontSize * 2}px; text-decoration: none; animation-delay: 0.2s;">
                  🏥 撥打 1966<br>
                  <span style="font-size: ${fontSize * 1.2}px;">衛生福利部</span>
                </a>
              </div>
              
              <div class="mt-8 p-6 rounded-xl" style="background: #fef3c7; border: 3px solid ${defaultConfig.accent_color};">
                <p style="font-size: ${fontSize * 1.1}px; color: ${defaultConfig.text_color}; text-align: center; font-weight: bold;">
                  ⚠️ 緊急狀況請立即撥打電話求助！
                </p>
              </div>
              
              <button onclick="currentPage='home'; render();" 
                class="w-full mt-6 py-4 rounded-xl font-bold text-white transition-all transform hover:scale-105 btn-scale"
                style="background: ${defaultConfig.button_color}; font-size: ${fontSize * 1.1}px;">
                🏠 返回首頁
              </button>
            </div>
          </div>
        </div>
      `;
    }
    
    window.focusPark = function(parkId) {
      const park = PARKS.find(p => p.id === parkId);
      if (!park || !window.parkMap) return;
      
      window.parkMap.setView([park.lat, park.lng], 16);
      
      if (window.currentMarker) {
        window.currentMarker.remove();
      }
      
      window.currentMarker = L.marker([park.lat, park.lng])
        .addTo(window.parkMap)
        .bindPopup(`
          <div style="font-size: 14px;">
            <strong style="font-size: 16px;">${park.name}</strong><br>
            ⭐ 評分：${park.rating} / 5.0<br>
            🌳 特色：${park.features}
          </div>
        `)
        .openPopup();
    };
    
    window.confirmMedication = function() {
      const overlay = document.getElementById('medicationOverlay');
      if (overlay) {
        overlay.remove();
      }
      
      if (!currentUser || currentUser.isAdmin) return;
      
      const updates = {
        medication_completed: true,
        medication_date: new Date().toLocaleDateString('zh-TW'),
        fertilizers: (currentUser.fertilizers || 0) + 1
      };
      
      const updatedUser = updateUserInStorage(currentUser.username, updates);
      
      if (updatedUser) {
        currentUser = updatedUser;
        showMessage('✅ 已確認服藥！獲得肥料一包 💩', defaultConfig.primary_color);
      }
    };
    
    window.manualConfirmMedication = function() {
      window.confirmMedication();
      render();
    };
    
    window.usePesticide = function() {
      if (!currentUser || currentUser.isAdmin) return;
      
      allUsers = loadUsersFromStorage();
      const userData = allUsers.find(u => u.username === currentUser.username);
      
      if (!userData || (userData.pesticides || 0) === 0) return;
      
      vibrate(50);
      
      const newProgress = Math.min((userData.growth_progress || 0) + 10, 100);
      
      const updates = {
        pesticides: (userData.pesticides || 0) - 1,
        growth_progress: newProgress,
        total_nutrients: (userData.total_nutrients || 0) + 10
      };
      
      if (newProgress >= 100) {
        vibrate([100, 50, 100, 50, 100]);
        updates.growth_progress = 0;
        updates.completed_plants = (userData.completed_plants || 0) + 1;
        
        const updatedUser = updateUserInStorage(currentUser.username, updates);
        
        if (updatedUser) {
          currentUser = updatedUser;
          render();
          
          showCenterMessage(`
            <div style="text-align: center;">
              <div style="font-size: ${fontSize * 4}px; margin-bottom: 16px;">🥕</div>
              <div style="font-size: ${fontSize * 2}px; font-weight: bold;">蘿蔔苗長大了！</div>
              <div style="font-size: ${fontSize * 1.2}px; margin-top: 12px;">恭喜收穫第 ${updatedUser.completed_plants} 顆蘿蔔！</div>
            </div>
          `, defaultConfig.primary_color, 3000);
        }
      } else {
        const updatedUser = updateUserInStorage(currentUser.username, updates);
        
        if (updatedUser) {
          currentUser = updatedUser;
          render();
          
          showMessage('🐛✨ 使用除蟲劑成功！蘿蔔苗 +10% 成長', defaultConfig.button_color);
        }
      }
    };
    
    window.useFertilizer = function() {
      if (!currentUser || currentUser.isAdmin) return;
      
      allUsers = loadUsersFromStorage();
      const userData = allUsers.find(u => u.username === currentUser.username);
      
      if (!userData || (userData.fertilizers || 0) === 0) return;
      
      vibrate(50);
      
      const newProgress = Math.min((userData.growth_progress || 0) + 15, 100);
      
      const updates = {
        fertilizers: (userData.fertilizers || 0) - 1,
        growth_progress: newProgress,
        total_nutrients: (userData.total_nutrients || 0) + 15
      };
      
      if (newProgress >= 100) {
        vibrate([100, 50, 100, 50, 100]);
        updates.growth_progress = 0;
        updates.completed_plants = (userData.completed_plants || 0) + 1;
        
        const updatedUser = updateUserInStorage(currentUser.username, updates);
        
        if (updatedUser) {
          currentUser = updatedUser;
          render();
          
          showCenterMessage(`
            <div style="text-align: center;">
              <div style="font-size: ${fontSize * 4}px; margin-bottom: 16px;">🥕</div>
              <div style="font-size: ${fontSize * 2}px; font-weight: bold;">蘿蔔苗長大了！</div>
              <div style="font-size: ${fontSize * 1.2}px; margin-top: 12px;">恭喜收穫第 ${updatedUser.completed_plants} 顆蘿蔔！</div>
            </div>
          `, defaultConfig.primary_color, 3000);
        }
      } else {
        const updatedUser = updateUserInStorage(currentUser.username, updates);
        
        if (updatedUser) {
          currentUser = updatedUser;
          render();
          
          showMessage('💩✨ 使用肥料成功！蘿蔔苗 +15% 成長', defaultConfig.primary_color);
        }
      }
    };
    
    function render() {
      const app = document.getElementById('app');
      if (!app) return;
      
      let content = '';
      
      switch(currentPage) {
        case 'login':
          content = renderLogin();
          break;
        case 'register':
          content = renderRegister();
          break;
        case 'admin':
          content = renderAdmin();
          break;
        case 'home':
          content = renderHome();
          break;
        case 'games':
          content = renderGames();
          break;
        case 'settings':
          content = renderSettings();
          break;
        case 'survey':
          content = renderSurvey();
          break;
        case 'memory':
          content = renderMemoryGame();
          break;
        case 'math':
          content = renderMathGame();
          break;
        case 'matching':
          content = renderMatchingGame();
          break;
        case 'parks':
          content = renderParks();
          break;
        case 'health':
          content = renderHealth();
          break;
        case 'emergency':
          content = renderEmergency();
          break;
      }
      
      app.innerHTML = content;
      attachEventListeners();
    }
    
    function attachEventListeners() {
      const loginForm = document.getElementById('loginForm');
      if (loginForm) {
        loginForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const username = document.getElementById('loginUsername').value.trim();
          const password = document.getElementById('loginPassword').value.trim();
          handleLogin(username, password);
        });
      }
      
      const registerForm = document.getElementById('registerForm');
      if (registerForm) {
        registerForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const username = document.getElementById('regUsername').value;
          const password = document.getElementById('regPassword').value;
          const displayName = document.getElementById('regDisplayName').value;
          handleRegister(username, password, displayName);
        });
      }
      
      const fontSizeSlider = document.getElementById('fontSizeSlider');
      if (fontSizeSlider) {
        fontSizeSlider.addEventListener('input', (e) => {
          fontSize = parseInt(e.target.value);
          localStorage.setItem(FONT_SIZE_KEY, fontSize);
          document.getElementById('fontSizeDisplay').textContent = fontSize + 'px';
          document.getElementById('fontSizeDisplay').style.fontSize = fontSize + 'px';
        });
      }
      
      const medicationForm = document.getElementById('medicationForm');
      if (medicationForm) {
        medicationForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const name = document.getElementById('medicationName').value;
          const time = document.getElementById('medicationTime').value;
          
          if (!currentUser || currentUser.isAdmin) return;
          
          const updates = {
            medication_name: name,
            medication_time: time,
            medication_completed: false,
            medication_date: ''
          };
          
          const updatedUser = updateUserInStorage(currentUser.username, updates);
          
          if (updatedUser) {
            currentUser = updatedUser;
            showMessage('✅ 服藥提醒已設定成功！', defaultConfig.primary_color);
            setTimeout(() => render(), 2000);
          }
        });
      }
      
      if (currentPage === 'parks') {
        setTimeout(() => {
          const mapElement = document.getElementById('map');
          if (mapElement) {
            if (window.parkMap) {
              window.parkMap.remove();
              window.parkMap = null;
            }
            
            window.parkMap = L.map('map').setView([25.1289, 121.7268], 13);
            
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
              attribution: '© OpenStreetMap contributors'
            }).addTo(window.parkMap);
            
            PARKS.forEach(park => {
              L.marker([park.lat, park.lng])
                .addTo(window.parkMap)
                .bindPopup(`
                  <div style="font-size: 14px;">
                    <strong style="font-size: 16px;">${park.name}</strong><br>
                    ⭐ 評分：${park.rating} / 5.0<br>
                    🌳 特色：${park.features}
                  </div>
                `);
            });
          }
        }, 100);
      }
    }
    
    // 初始化應用程式
    render();
    
    // 每30秒檢查一次服藥提醒
    setInterval(checkMedicationReminder, 30000);
    checkMedicationReminder();
  </script>
