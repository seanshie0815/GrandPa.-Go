    body {

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    
    @keyframes pulse-glow {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.05); }
    }
    
    @keyframes bounce-in {
      0% { transform: scale(0.5); opacity: 0; }
      50% { transform: scale(1.03); }
      70% { transform: scale(0.94); }
      100% { transform: scale(1); opacity: 1; }
    }
    
    @keyframes slide-up {
      from { transform: translateY(12px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    
    @keyframes celebration {
      0% { transform: scale(1) rotate(0deg); }
      25% { transform: scale(1.12) rotate(6deg); }
      50% { transform: scale(1.06) rotate(-6deg); }
      75% { transform: scale(1.12) rotate(6deg); }
      100% { transform: scale(1) rotate(0deg); }
    }
    
    .float-animation {
      animation: float 3s ease-in-out infinite;
    }
    
    .pulse-animation {
      animation: pulse-glow 2s ease-in-out infinite;
    }
    
    .bounce-in {
      animation: bounce-in 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }
    
    .slide-up {
      animation: slide-up 0.5s ease-out;
    }
    
    .celebration {
      animation: celebration 0.6s ease-in-out;
    }
    
    .btn-scale:active {
      transform: scale(0.95);
    }
    
    .page-transition {
      transition: opacity 0.3s ease-in-out;
    }
    
    .card-flip {
      transition: transform 0.6s;
      transform-style: preserve-3d;
    }
    
    .card-flip.flipped {
      transform: rotateY(180deg);
    }
    
    .card-front, .card-back {
      backface-visibility: hidden;
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 0.75rem;
    }
    
    .card-back {
      transform: rotateY(180deg);
    }

  <script>
    const defaultConfig = {

    };
    
    let currentUser = null;
    let allUsers = [];
    let currentPage = 'login';
    let fontSize = 18;
    
    const ADMIN_USERNAME = 'Admin';
    const ADMIN_PASSWORD = 'admin';
    
    const FRUIT_EMOJIS = ['? ', '? ', '? ', '? ', '? ', '? ', '? ', '? '];

      { id: 5, name: "        ", lat: 24.9598, lng: 121.2201, rating: 4.4, features: "     ߦ m B ] I     B  q?? Q" },
      { id: 6, name: " C H    ", lat: 25.0123, lng: 121.2156, rating: 4.5, features: " { N      B L  ê ] p B e   ξA" }
    ];
    
    let medicationCheckInterval = null;
    
    const dataHandler = {
      onDataChanged(data) {
        allUsers = data;
        if (currentUser && currentPage !== 'admin') {
          const userData = allUsers.find(u => u.username === currentUser.username);
          if (userData) {
            currentUser = userData;
          }
        }
        render();
      }
    };
    
    async function initApp() {
      const result = await window.dataSdk.init(dataHandler);
      if (!result.isOk) {
        console.error('Failed to initialize data SDK');
        return;
      }
      
      const savedFontSize = localStorage.getItem('grandpa_go_font_size');
      if (savedFontSize) {
        fontSize = parseInt(savedFontSize);
      }
      
      startMedicationCheck();
      render();
    }
    
    function startMedicationCheck() {
      if (medicationCheckInterval) {
        clearInterval(medicationCheckInterval);
      }
      
      medicationCheckInterval = setInterval(() => {
        if (!currentUser || currentUser.isAdmin) return;
        
        const userData = allUsers.find(u => u.username === currentUser.username);
        if (!userData || !userData.medication_name || !userData.medication_time) return;
        
        const today = new Date().toLocaleDateString('zh-TW');
        if (userData.medication_completed && userData.medication_date === today) return;
        
        const now = new Date();
        const currentTime = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        
        if (currentTime === userData.medication_time) {
          showMedicationReminder();
        }
      }, 10000);
    }
    
    function showMedicationReminder() {
      const overlay = document.createElement('div');
      overlay.style.cssText = `
        position: fixed; 
        top: 0; 
        left: 0; 
        width: 100%; 
        height: 100%; 
        background: rgba(0,0,0,0.95); 
        z-index: 9999; 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        justify-content: center;
        padding: 20px;
      `;
      
      overlay.innerHTML = `
        <div class="text-center bounce-in">
          <div style="font-size: ${fontSize * 8}px; margin-bottom: 30px;">? </div>
          <h1 style="font-size: ${fontSize * 2.5}px; color: white; font-weight: bold; margin-bottom: 30px;"> A Ĵ   I</h1>
          <p style="font-size: ${fontSize * 1.8}px; color: white; margin-bottom: 50px;">
             ӦY   o G${currentUser.medication_name}
          </p>
          <button onclick="confirmMedication()" 
            style="background: ${defaultConfig.primary_color}; color: white; font-size: ${fontSize * 1.5}px; padding: 20px 60px; border-radius: 20px; font-weight: bold; border: none; cursor: pointer;">
             w A   ?
          </button>
        </div>
      `;
      
      overlay.id = 'medicationOverlay';
      document.body.appendChild(overlay);
    }
    
    function showCelebration() {
      const container = document.querySelector('.main-content');
      if (container) {
        container.classList.add('celebration');
        setTimeout(() => container.classList.remove('celebration'), 600);
      }
    }
    
    async function handleLogin(username, password) {
      if (username === ADMIN_USERNAME && password === ADMIN_PASSWORD) {
        currentUser = { username: ADMIN_USERNAME, isAdmin: true };
        currentPage = 'admin';
        render();
        return;
      }
      
      const user = allUsers.find(u => u.username === username && u.password === password);
      
      if (user) {
        currentUser = user;
        user.last_login = new Date().toISOString();
        const updateResult = await window.dataSdk.update(user);
        if (updateResult.isOk) {
          currentPage = 'home';
          render();
        }
      } else {
        const errorMsg = document.createElement('div');
        errorMsg.textContent = ' b   αK X   ~';
        errorMsg.style.cssText = `position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #ef4444; color: white; padding: 12px 24px; border-radius: 8px; font-size: ${fontSize}px;`;
        document.body.appendChild(errorMsg);
        setTimeout(() => errorMsg.remove(), 2000);
      }
    }
    
    async function handleRegister(username, password, displayName) {
      if (allUsers.length >= 999) {
        const errorMsg = document.createElement('div');
        errorMsg.textContent = ' w F ϥΪ̼ƶq W   ]999 H ^';
        errorMsg.style.cssText = `position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #ef4444; color: white; padding: 12px 24px; border-radius: 8px; font-size: ${fontSize}px;`;
        document.body.appendChild(errorMsg);
        setTimeout(() => errorMsg.remove(), 2000);
        return;
      }
      
      if (allUsers.some(u => u.username === username)) {
        const errorMsg = document.createElement('div');
        errorMsg.textContent = '   b   w s b';
        errorMsg.style.cssText = `position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #ef4444; color: white; padding: 12px 24px; border-radius: 8px; font-size: ${fontSize}px;`;
        document.body.appendChild(errorMsg);
        setTimeout(() => errorMsg.remove(), 2000);
        return;
      }
      
      const newUser = {
        username,
        password,
        display_name: displayName,
        growth_progress: 0,
        total_nutrients: 0,
        games_completed: 0,
        completed_plants: 0,
        created_at: new Date().toISOString(),
        last_login: new Date().toISOString()
      };
      
      const result = await window.dataSdk.create(newUser);

          render();
        }, 2000);
      } else {
        const errorMsg = document.createElement('div');
        errorMsg.textContent = '   U   ѡA еy  ??  ';
        errorMsg.style.cssText = `position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #ef4444; color: white; padding: 12px 24px; border-radius: 8px; font-size: ${fontSize}px;`;
        document.body.appendChild(errorMsg);
        setTimeout(() => errorMsg.remove(), 2000);
      }
    }
    
    async function addNutrients(amount) {
      if (!currentUser || currentUser.isAdmin) return;
      
      currentUser.total_nutrients += amount;
      currentUser.growth_progress += amount;
      
      while (currentUser.growth_progress >= 100) {
        currentUser.growth_progress -= 100;
        currentUser.completed_plants = (currentUser.completed_plants || 0) + 1;
      }
      
      currentUser.games_completed += 1;
      
      const result = await window.dataSdk.update(currentUser);
      if (result.isOk) {
        showCelebration();
      }
    }
    
    function getPlantStage(progress) {
      if (progress < 25) return '? ';
      if (progress < 50) return '? ';
      if (progress < 75) return '? ';
      if (progress < 100) return '? ';
      return '? ';
    }
    
    function renderLogin() {
      return `

    // ========== localStorage 資料管理系統 ==========
    const STORAGE_KEY = 'grandpa_go_users';
    const CURRENT_USER_KEY = 'grandpa_go_current_user';
    const FONT_SIZE_KEY = 'grandpa_go_font_size';
    
    // 從 localStorage 載入所有使用者
    function loadUsersFromStorage() {
      try {
        const data = localStorage.getItem(STORAGE_KEY);
        return data ? JSON.parse(data) : [];
      } catch (error) {
        console.error('載入使用者資料失敗:', error);
        return [];
      }
    }
    
    // 儲存所有使用者到 localStorage
    function saveUsersToStorage(users) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(users));
        return true;
      } catch (error) {
        console.error('儲存使用者資料失敗:', error);
        return false;
      }
    }
    
    // 儲存當前登入使用者
    function saveCurrentUser(user) {
      try {
        localStorage.setItem(CURRENT_USER_KEY, JSON.stringify(user));
      } catch (error) {
        console.error('儲存當前使用者失敗:', error);
      }
    }
    
    // 載入當前登入使用者
    function loadCurrentUser() {
      try {
        const data = localStorage.getItem(CURRENT_USER_KEY);
        return data ? JSON.parse(data) : null;
      } catch (error) {
        console.error('載入當前使用者失敗:', error);
        return null;
      }
    }
    
    // 清除當前登入使用者
    function clearCurrentUser() {
      localStorage.removeItem(CURRENT_USER_KEY);
    }
    
    // 更新使用者資料
    function updateUserInStorage(username, updates) {
      const users = loadUsersFromStorage();
      const userIndex = users.findIndex(u => u.username === username);
      
      if (userIndex !== -1) {
        users[userIndex] = { ...users[userIndex], ...updates };
        saveUsersToStorage(users);
        
        // 如果是當前使用者，也更新當前使用者快取
        const currentUser = loadCurrentUser();
        if (currentUser && currentUser.username === username) {
          saveCurrentUser(users[userIndex]);
        }
        
        return users[userIndex];
      }
      return null;
    }
    
    // 建立新使用者

      const users = loadUsersFromStorage();
      
      // 檢查是否已存在

        return { success: false, message: '此帳號已存在' };

      // 新增使用者
      const newUser = {
        ...userData,
        created_at: new Date().toISOString(),
        last_login: new Date().toISOString()
      };
      
      users.push(newUser);
      
      if (saveUsersToStorage(users)) {
        return { success: true, user: newUser };
      } else {
        return { success: false, message: '儲存失敗' };
      }
    }

      const newUser = {
        username,
        password,
        display_name: displayName,
        growth_progress: 0,
        total_nutrients: 0,
        games_completed: 0,
        completed_plants: 0,
        pesticides: 0,
        fertilizers: 0,
        medication_name: '',
        medication_time: '',
        medication_completed: false,
        medication_date: ''
      };
      
      const result = createUserInStorage(newUser);
      
      if (result.success) {
        showMessage('✅ 註冊成功！請登入', defaultConfig.primary_color);
        setTimeout(() => {
          currentPage = 'login';
          render();
        }, 2000);
      } else {
        showMessage('❌ ' + result.message, '#ef4444');
      }
    }
    
    function handleLogout() {
      currentUser = null;
      clearCurrentUser();
      currentPage = 'login';
      render();
    }
    
    function deleteUser(username) {
      if (deleteUserFromStorage(username)) {
        allUsers = loadUsersFromStorage();
        showMessage('✅ 用戶已刪除', defaultConfig.primary_color);
        render();
      }
    }
    
    function addPesticide() {
      if (!currentUser || currentUser.isAdmin) return;
      
      const updates = {
        pesticides: (currentUser.pesticides || 0) + 1,
        games_completed: (currentUser.games_completed || 0) + 1
      };
      
      const updatedUser = updateUserInStorage(currentUser.username, updates);
      if (updatedUser) {
        currentUser = updatedUser;
        allUsers = loadUsersFromStorage();
        return true;
      }
      return false;
    }
    
    function addFertilizer() {
      if (!currentUser || currentUser.isAdmin) return;
      
      const updates = {
        fertilizers: (currentUser.fertilizers || 0) + 1,
        games_completed: (currentUser.games_completed || 0) + 1
      };
      
      const updatedUser = updateUserInStorage(currentUser.username, updates);
      if (updatedUser) {
        currentUser = updatedUser;
        allUsers = loadUsersFromStorage();
        return true;
      }
      return false;
    }
    
    function showMessage(message, bgColor) {
      const msg = document.createElement('div');
      msg.textContent = message;
      msg.style.cssText = `position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: ${bgColor}; color: white; padding: 16px 32px; border-radius: 12px; font-size: ${fontSize * 1.2}px; font-weight: bold; z-index: 10000;`;
      document.body.appendChild(msg);
      setTimeout(() => msg.remove(), 3000);
    }
    
    function showCenterMessage(html, bgColor, duration = 2000) {
      const msg = document.createElement('div');
      msg.innerHTML = html;
      msg.style.cssText = `position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: ${bgColor}; color: white; padding: 30px 50px; border-radius: 20px; font-size: ${fontSize}px; z-index: 10000; box-shadow: 0 10px 40px rgba(0,0,0,0.3);`;
      document.body.appendChild(msg);
      setTimeout(() => msg.remove(), duration);
    }
    
    function vibrate(pattern) {
      if (navigator.vibrate) {

      if (isCorrect) {

        state.correctAnswers += 1;
        state.fertilizersEarned = (state.fertilizersEarned || 0) + 1;
      } else {
        vibrate([200]);

      state.showResult = true;
      render();

    window.selectMemoryFruit = function(fruit) {
      if (!window.memoryState || window.memoryState.phase !== 'test') return;
      
      const expectedIndex = window.memoryState.userSequence.length;
      const expectedFruit = window.memoryState.sequence[expectedIndex];
      
      if (fruit === expectedFruit) {
        window.memoryState.userSequence.push(fruit);
        
        if (window.memoryState.userSequence.length === window.memoryState.sequence.length) {
          addPesticide();
          
          showCenterMessage(`
            <div style="text-align: center;">
              <div style="font-size: ${fontSize * 3}px; margin-bottom: 10px;">🎉</div>
              <div style="font-size: ${fontSize * 1.8}px; font-weight: bold;">恭喜答對！</div>

          </div>
        `, '#ef4444');
        
        setTimeout(() => {
          currentPage = 'games';
          window.memoryState = null;
          render();
        }, 2000);
      }
    };
    
    window.flipMatchCard = function(cardId) {
      const card = window.matchingCards.find(c => c.id === cardId);
      if (!card || card.matched) return;
      
      if (window.matchingState.flipped.includes(cardId)) return;
      if (window.matchingState.flipped.length >= 2) return;
      if (window.matchingState.processing) return;
      
      const cardElement = document.getElementById(`card-${cardId}`);
      cardElement.classList.add('flipped');
      window.matchingState.flipped.push(cardId);
      
      if (window.matchingState.flipped.length === 2) {
        window.matchingState.processing = true;
        
        const [id1, id2] = window.matchingState.flipped;
        const card1 = window.matchingCards.find(c => c.id === id1);
        const card2 = window.matchingCards.find(c => c.id === id2);
        
        if (card1.fruit === card2.fruit) {
          setTimeout(() => {
            card1.matched = true;
            card2.matched = true;
